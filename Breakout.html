<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakout</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --accent-2: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        --shadow: 0 20px 40px rgba(15, 23, 42, 0.4);
        --page-background: radial-gradient(circle at top, #172554 0%, var(--bg) 40%, #020817 100%);
        --app-background: rgba(17, 24, 39, 0.9);
        --hud-background: rgba(31, 41, 55, 0.9);
        --canvas-background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        --border-color: rgba(148, 163, 184, 0.25);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #e2e8f0;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --text: #0f172a;
        --muted: #334155;
        --accent: #0284c7;
        --accent-2: #059669;
        --danger: #dc2626;
        --warning: #d97706;
        --shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
        --page-background: radial-gradient(circle at top, #ffffff 0%, #e2e8f0 55%, #cbd5e1 100%);
        --app-background: rgba(255, 255, 255, 0.94);
        --hud-background: #f1f5f9;
        --canvas-background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        --border-color: rgba(51, 65, 85, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page-background);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .app {
        width: min(92vw, 900px);
        background: var(--app-background);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding: 10px 14px;
        background: var(--hud-background);
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }

      .stat {
        font-weight: 700;
        color: var(--muted);
      }

      .stat strong {
        color: var(--text);
        margin-left: 8px;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: var(--canvas-background);
        border-radius: 18px;
        border: 2px solid var(--border-color);
      }

      .message {
        margin-top: 14px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
        min-height: 24px;
      }

      .legend {
        margin-top: 8px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .legend span {
        display: inline-block;
        margin: 0 8px;
      }

      .legend b {
        display: inline-block;
        width: 22px;
        border-radius: 6px;
        color: #0f172a;
        margin-right: 4px;
      }

      .level-pick {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--muted);
      }

      select {
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
        padding: 10px 12px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .hint {
        margin: 8px 0 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 580px) {
        .app {
          padding: 16px;
        }

        .hud {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Breakout</h1>

      <div class="hud">
        <div class="stat">Score<strong id="score">0</strong></div>
        <div class="stat">Lives<strong id="lives">3</strong></div>
        <div class="stat">Level<strong id="level">1</strong></div>
        <div class="stat">Power-up<strong id="powerup">None</strong></div>
        <div class="controls">
          <label class="level-pick" for="themeSelect">
            Theme
            <select id="themeSelect" aria-label="Theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </label>
          <label class="level-pick">
            Start at
            <select id="levelSelect" aria-label="Starting level">
              <option value="1">Level 1</option>
              <option value="2">Level 2</option>
              <option value="3">Level 3</option>
              <option value="4">Level 4</option>
              <option value="5">Level 5</option>
            </select>
          </label>
          <button id="startBtn" type="button">Start / Restart</button>
        </div>
      </div>

      <canvas id="gameCanvas" width="800" height="520" aria-label="Breakout game board"></canvas>
      <div id="message" class="message">Press Start or Space to begin.</div>
      <div class="legend">
        <span><b style="background:#34d399">W</b>Wide paddle</span>
        <span><b style="background:#38bdf8">S</b>Slow ball</span>
        <span><b style="background:#f472b6">+</b>Extra life</span>
      </div>
      <p class="hint">Pick a level, then press Start. Clear every brick to advance. Higher levels add a row and speed up the ball.</p>
    </main>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const levelEl = document.getElementById('level');
      const powerupEl = document.getElementById('powerup');
      const messageEl = document.getElementById('message');
      const startBtn = document.getElementById('startBtn');
      const levelSelect = document.getElementById('levelSelect');
      const themeSelect = document.getElementById('themeSelect');

      const keys = {
        left: false,
        right: false,
      };

      const BASE_PADDLE_WIDTH = 150;
      const WIDE_PADDLE_WIDTH = 230;

      const paddle = {
        width: BASE_PADDLE_WIDTH,
        height: 16,
        x: canvas.width / 2 - BASE_PADDLE_WIDTH / 2,
        y: canvas.height - 28,
        speed: 8,
      };

      const ball = {
        radius: 10,
        x: canvas.width / 2,
        y: canvas.height - 40,
        vx: 4,
        vy: -4,
        stuck: true,
      };

      const brickConfig = {
        cols: 8,
        width: 82,
        height: 24,
        padding: 10,
        offsetTop: 50,
        offsetLeft: 40,
      };

      const BASE_ROWS = 5;
      const MAX_ROWS = 9;
      const MAX_LEVEL = 5;
      const BASE_SPEED = 4;

      // ---------- Power-up settings ----------
      const POWERUP_DROP_CHANCE = 0.18; // chance a broken brick drops a power-up
      const POWERUP_TYPES = {
        wide: { label: 'W', color: '#34d399', name: 'Wide paddle', duration: 10000 },
        slow: { label: 'S', color: '#38bdf8', name: 'Slow ball', duration: 8000 },
        life: { label: '+', color: '#f472b6', name: 'Extra life', duration: 0 },
      };

      let powerUps = []; // capsules currently falling
      let effects = { wideUntil: 0, slowUntil: 0 }; // when timed effects end

      let bricks = [];
      let score = 0;
      let lives = 3;
      let level = 1;
      let gameRunning = false;
      let gameOver = false;
      let animationId = null;

      function rowCountFor(currentLevel) {
        return Math.min(BASE_ROWS + (currentLevel - 1), MAX_ROWS);
      }

      function launchSpeedFor(currentLevel) {
        return Math.min(BASE_SPEED + (currentLevel - 1) * 0.7, 8);
      }

      function setMessage(text) {
        messageEl.textContent = text;
      }

      function applyTheme() {
        document.documentElement.dataset.theme = themeSelect.value;
      }

      function buildBricks() {
        bricks = [];
        const rows = rowCountFor(level);
        const colors = ['#38bdf8', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#fb7185', '#22d3ee', '#facc15'];
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < brickConfig.cols; col += 1) {
            bricks.push({
              x: brickConfig.offsetLeft + col * (brickConfig.width + brickConfig.padding),
              y: brickConfig.offsetTop + row * (brickConfig.height + brickConfig.padding),
              width: brickConfig.width,
              height: brickConfig.height,
              alive: true,
              color: colors[row % colors.length],
            });
          }
        }
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        livesEl.textContent = String(lives);
        levelEl.textContent = String(level);
        updatePowerupHud();
      }

      function updatePowerupHud() {
        const now = performance.now();
        const active = [];
        if (effects.wideUntil > now) {
          active.push(`Wide ${Math.ceil((effects.wideUntil - now) / 1000)}s`);
        }
        if (effects.slowUntil > now) {
          active.push(`Slow ${Math.ceil((effects.slowUntil - now) / 1000)}s`);
        }
        powerupEl.textContent = active.length ? active.join(', ') : 'None';
      }

      function resetBall() {
        const speed = launchSpeedFor(level);
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 2;
        ball.vx = (Math.random() * 2 - 1) * speed;
        ball.vy = -speed;
        ball.stuck = true;
      }

      function clearPowerUps() {
        powerUps = [];
        effects = { wideUntil: 0, slowUntil: 0 };
        setPaddleWidth(BASE_PADDLE_WIDTH);
      }

      function resetGame() {
        score = 0;
        lives = 3;
        level = Number(levelSelect.value) || 1;
        gameOver = false;
        gameRunning = false;
        buildBricks();
        clearPowerUps();
        paddle.x = canvas.width / 2 - paddle.width / 2;
        resetBall();
        updateHud();
        setMessage(`Level ${level}. Press Start or Space to begin.`);
        draw();
      }

      function advanceLevel() {
        if (level >= MAX_LEVEL) {
          gameRunning = false;
          gameOver = true;
          levelSelect.value = '1';
          updateHud();
          setMessage('You cleared all 5 levels! Press Start to play again from level 1.');
          return;
        }

        level += 1;
        levelSelect.value = String(level);
        clearPowerUps();
        buildBricks();
        resetBall();
        updateHud();
        setMessage(`Level ${level}! ${rowCountFor(level)} rows and a faster ball. Press Space to launch.`);
      }

      function startGame() {
        if (gameOver) {
          resetGame();
        }

        gameRunning = true;
        ball.stuck = false;
        setMessage('Game on!');
      }

      function loseLife() {
        lives -= 1;
        powerUps = []; // falling capsules disappear when a life is lost
        updateHud();

        if (lives <= 0) {
          gameOver = true;
          gameRunning = false;
          setMessage('Game over! Press Start to try again.');
          return;
        }

        setMessage(`Life lost on level ${level}. Press Space to continue.`);
        resetBall();
      }

      // ---------- Power-up logic ----------
      function setPaddleWidth(newWidth) {
        const center = paddle.x + paddle.width / 2;
        paddle.width = newWidth;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, center - paddle.width / 2));
      }

      function maybeDropPowerUp(brick) {
        if (Math.random() > POWERUP_DROP_CHANCE) return;
        const types = Object.keys(POWERUP_TYPES);
        const type = types[Math.floor(Math.random() * types.length)];
        powerUps.push({
          type,
          x: brick.x + brick.width / 2,
          y: brick.y + brick.height / 2,
          width: 34,
          height: 18,
          vy: 2.5,
        });
      }

      function applyPowerUp(type) {
        const now = performance.now();
        const info = POWERUP_TYPES[type];

        if (type === 'wide') {
          effects.wideUntil = now + info.duration;
          setPaddleWidth(WIDE_PADDLE_WIDTH);
        } else if (type === 'slow') {
          effects.slowUntil = now + info.duration;
        } else if (type === 'life') {
          lives += 1;
        }

        setMessage(`Power-up: ${info.name}!`);
        updateHud();
      }

      function updatePowerUps() {
        const now = performance.now();

        // Move falling capsules and check if the paddle catches them
        for (const p of powerUps) {
          p.y += p.vy;
          const caught =
            p.y + p.height / 2 >= paddle.y &&
            p.y - p.height / 2 <= paddle.y + paddle.height &&
            p.x + p.width / 2 >= paddle.x &&
            p.x - p.width / 2 <= paddle.x + paddle.width;
          if (caught) {
            applyPowerUp(p.type);
            p.done = true;
          } else if (p.y - p.height / 2 > canvas.height) {
            p.done = true;
          }
        }
        powerUps = powerUps.filter((p) => !p.done);

        // Expire the wide paddle when its timer runs out
        if (effects.wideUntil && now >= effects.wideUntil) {
          effects.wideUntil = 0;
          setPaddleWidth(BASE_PADDLE_WIDTH);
        }
        if (effects.slowUntil && now >= effects.slowUntil) {
          effects.slowUntil = 0;
        }

        updatePowerupHud();
      }

      function ballSpeedMultiplier() {
        return effects.slowUntil > performance.now() ? 0.6 : 1;
      }

      function update() {
        if (!gameRunning) return;

        if (keys.left && paddle.x > 0) {
          paddle.x = Math.max(0, paddle.x - paddle.speed);
        }

        if (keys.right && paddle.x + paddle.width < canvas.width) {
          paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
        }

        updatePowerUps();

        if (ball.stuck) {
          ball.x = paddle.x + paddle.width / 2;
          ball.y = paddle.y - ball.radius - 2;
          return;
        }

        const speedMult = ballSpeedMultiplier();
        ball.x += ball.vx * speedMult;
        ball.y += ball.vy * speedMult;

        if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= canvas.width) {
          ball.vx *= -1;
        }

        if (ball.y - ball.radius <= 0) {
          ball.vy *= -1;
        }

        if (ball.y + ball.radius >= paddle.y &&
            ball.y - ball.radius <= paddle.y + paddle.height &&
            ball.x >= paddle.x &&
            ball.x <= paddle.x + paddle.width &&
            ball.vy > 0) {
          const relativeImpact = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const bounceAngle = relativeImpact * 1.1;
          ball.vx = Math.max(5, launchSpeedFor(level)) * bounceAngle;
          ball.vy = -Math.abs(ball.vy) - 0.2;
        }

        for (const brick of bricks) {
          if (!brick.alive) continue;

          const hit =
            ball.x + ball.radius > brick.x &&
            ball.x - ball.radius < brick.x + brick.width &&
            ball.y + ball.radius > brick.y &&
            ball.y - ball.radius < brick.y + brick.height;

          if (hit) {
            brick.alive = false;
            score += 10;
            updateHud();
            ball.vy *= -1;
            maybeDropPowerUp(brick);

            if (bricks.every((item) => !item.alive)) {
              advanceLevel();
            }
            break;
          }
        }

        if (ball.y - ball.radius > canvas.height) {
          loseLife();
        }
      }

      function drawBricks() {
        for (const brick of bricks) {
          if (!brick.alive) continue;
          ctx.fillStyle = brick.color;
          ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
        }
      }

      function drawPaddle() {
        // Paddle glows green while the wide power-up is active
        ctx.fillStyle = effects.wideUntil > performance.now() ? '#34d399' : '#f8fafc';
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      }

      function drawBall() {
        // Ball turns blue while the slow power-up is active
        ctx.fillStyle = effects.slowUntil > performance.now() ? '#38bdf8' : '#fbbf24';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPowerUps() {
        for (const p of powerUps) {
          const info = POWERUP_TYPES[p.type];
          const left = p.x - p.width / 2;
          const top = p.y - p.height / 2;
          const r = p.height / 2;

          ctx.fillStyle = info.color;
          ctx.beginPath();
          ctx.moveTo(left + r, top);
          ctx.arcTo(left + p.width, top, left + p.width, top + p.height, r);
          ctx.arcTo(left + p.width, top + p.height, left, top + p.height, r);
          ctx.arcTo(left, top + p.height, left, top, r);
          ctx.arcTo(left, top, left + p.width, top, r);
          ctx.fill();

          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 13px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(info.label, p.x, p.y + 1);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
        for (let i = 0; i < canvas.width; i += 18) {
          ctx.fillRect(i, 0, 2, canvas.height);
        }

        drawBricks();
        drawPowerUps();
        drawPaddle();
        drawBall();
      }

      function gameLoop() {
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') {
          keys.left = true;
        }

        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') {
          keys.right = true;
        }

        if (event.code === 'Space') {
          event.preventDefault();
          if (!gameRunning && !gameOver) {
            startGame();
          } else if (ball.stuck && !gameOver) {
            ball.stuck = false;
            setMessage('Game on!');
          }
        }

        if (event.key.toLowerCase() === 'r') {
          resetGame();
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') {
          keys.left = false;
        }

        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') {
          keys.right = false;
        }
      });

      startBtn.addEventListener('click', () => {
        if (gameRunning) {
          resetGame();
        }
        startGame();
      });

      levelSelect.addEventListener('change', () => {
        if (gameRunning) {
          setMessage(`Level ${levelSelect.value} will apply when you press Start / Restart.`);
          return;
        }
        resetGame();
      });

      themeSelect.addEventListener('change', applyTheme);

      applyTheme();
      resetGame();
      gameLoop();
    </script>
  </body>
</html>
