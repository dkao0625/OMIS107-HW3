<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakout</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --accent-2: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        --shadow: 0 20px 40px rgba(15, 23, 42, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #172554 0%, var(--bg) 40%, #020817 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .app {
        width: min(92vw, 900px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 24px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding: 10px 14px;
        background: rgba(31, 41, 55, 0.9);
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .stat {
        font-weight: 700;
        color: var(--muted);
      }

      .stat strong {
        color: var(--text);
        margin-left: 8px;
      }

      .mode-picker {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-weight: 700;
      }

      select {
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 8px;
        font: inherit;
      }

      .player-stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .player-two {
        display: none;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        border-radius: 18px;
        border: 2px solid rgba(148, 163, 184, 0.25);
      }

      .message {
        margin-top: 14px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
        min-height: 24px;
      }

      @media (max-width: 580px) {
        .app {
          padding: 16px;
        }

        .hud {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Breakout</h1>

      <div class="hud">
        <label class="mode-picker" for="modeSelect">
          Mode
          <select id="modeSelect">
            <option value="one">1 Player</option>
            <option value="two">2 Players (Versus)</option>
          </select>
        </label>
        <div class="player-stats">
          <div class="stat">P1 Score<strong id="score1">0</strong></div>
          <div class="stat">P1 Lives<strong id="lives1">3</strong></div>
          <div class="stat player-two" id="playerTwoScore">P2 Score<strong id="score2">0</strong></div>
          <div class="stat player-two" id="playerTwoLives">P2 Lives<strong id="lives2">3</strong></div>
        </div>
        <div class="controls">
          <button id="startBtn" type="button">Start / Restart</button>
        </div>
      </div>

      <canvas id="gameCanvas" width="800" height="520" aria-label="Breakout game board"></canvas>
      <div id="message" class="message">P1: A/D or arrow keys. Press Start or Space to begin.</div>
    </main>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEls = [document.getElementById('score1'), document.getElementById('score2')];
      const livesEls = [document.getElementById('lives1'), document.getElementById('lives2')];
      const messageEl = document.getElementById('message');
      const startBtn = document.getElementById('startBtn');
      const modeSelect = document.getElementById('modeSelect');
      const playerTwoStats = [
        document.getElementById('playerTwoScore'),
        document.getElementById('playerTwoLives'),
      ];

      const keys = [
        { left: false, right: false },
        { left: false, right: false },
      ];

      const brickColors = ['#38bdf8', '#34d399', '#fbbf24', '#f472b6', '#a78bfa'];
      let players = [];
      let gameMode = 'one';
      let gameRunning = false;
      let gameOver = false;
      let animationId = null;

      function setMessage(text) {
        messageEl.textContent = text;
      }

      function createPlayer(index, boardX, boardWidth, cols, brickWidth, brickPadding) {
        const brickHeight = 24;
        const brickStart = gameMode === 'one'
          ? 40
          : (boardWidth - (cols * brickWidth + (cols - 1) * brickPadding)) / 2;
        const bricks = [];

        for (let row = 0; row < 5; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            bricks.push({
              x: brickStart + col * (brickWidth + brickPadding),
              y: 50 + row * (brickHeight + 10),
              width: brickWidth,
              height: brickHeight,
              alive: true,
              color: brickColors[row],
            });
          }
        }

        const paddle = {
          width: gameMode === 'one' ? 150 : 120,
          height: 16,
          x: boardWidth / 2 - (gameMode === 'one' ? 150 : 120) / 2,
          y: canvas.height - 28,
          speed: 8,
        };

        return {
          index,
          name: `Player ${index + 1}`,
          boardX,
          boardWidth,
          paddle,
          ball: {
            radius: 10,
            x: boardWidth / 2,
            y: canvas.height - 40,
            vx: 4,
            vy: -4,
            stuck: true,
          },
          bricks,
          score: 0,
          lives: 3,
        };
      }

      function updateHud() {
        players.forEach((player) => {
          scoreEls[player.index].textContent = String(player.score);
          livesEls[player.index].textContent = String(player.lives);
        });
      }

      function resetBall(player) {
        player.ball.x = player.paddle.x + player.paddle.width / 2;
        player.ball.y = player.paddle.y - player.ball.radius - 2;
        player.ball.vx = (Math.random() * 2 - 1) * 4;
        player.ball.vy = -4;
        player.ball.stuck = true;
      }

      function resetGame() {
        gameMode = modeSelect.value;
        const isTwoPlayer = gameMode === 'two';
        playerTwoStats.forEach((stat) => {
          stat.style.display = isTwoPlayer ? 'block' : 'none';
        });
        canvas.setAttribute(
          'aria-label',
          isTwoPlayer ? 'Two-player Breakout game board' : 'Breakout game board'
        );
        players = isTwoPlayer
          ? [
              createPlayer(0, 0, canvas.width / 2, 4, 70, 8),
              createPlayer(1, canvas.width / 2, canvas.width / 2, 4, 70, 8),
            ]
          : [createPlayer(0, 0, canvas.width, 8, 82, 10)];
        keys.forEach((playerKeys) => {
          playerKeys.left = false;
          playerKeys.right = false;
        });
        gameOver = false;
        gameRunning = false;
        updateHud();
        setMessage(isTwoPlayer
          ? 'P1: A/D. P2: Left/Right arrows. First to clear their board or outlast the other wins.'
          : 'P1: A/D or arrow keys. Press Start or Space to begin.');
        draw();
      }

      function startGame() {
        if (gameOver) {
          resetGame();
        }

        gameRunning = true;
        players.forEach((player) => {
          player.ball.stuck = false;
        });
        setMessage(gameMode === 'two' ? 'Versus match on!' : 'Game on!');
      }

      function finishMatch(winnerMessage) {
        gameOver = true;
        gameRunning = false;
        setMessage(winnerMessage);
      }

      function loseLife(player) {
        player.lives -= 1;
        updateHud();

        if (player.lives <= 0) {
          const otherPlayer = players.find((item) => item !== player);
          finishMatch(otherPlayer
            ? `${otherPlayer.name} wins! Press Start to play again.`
            : 'Game over! Press Start to try again.');
          return;
        }

        setMessage(`${player.name} lost a life! Press Space to continue.`);
        resetBall(player);
      }

      function updatePlayer(player) {
        const playerKeys = keys[player.index];
        const { paddle, ball } = player;

        if (playerKeys.left && paddle.x > 0) {
          paddle.x = Math.max(0, paddle.x - paddle.speed);
        }

        if (playerKeys.right && paddle.x + paddle.width < player.boardWidth) {
          paddle.x = Math.min(player.boardWidth - paddle.width, paddle.x + paddle.speed);
        }

        if (ball.stuck) {
          ball.x = paddle.x + paddle.width / 2;
          ball.y = paddle.y - ball.radius - 2;
          return;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= player.boardWidth) {
          ball.vx *= -1;
        }

        if (ball.y - ball.radius <= 0) {
          ball.vy *= -1;
        }

        if (ball.y + ball.radius >= paddle.y &&
            ball.y - ball.radius <= paddle.y + paddle.height &&
            ball.x >= paddle.x &&
            ball.x <= paddle.x + paddle.width &&
            ball.vy > 0) {
          const relativeImpact = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const bounceAngle = relativeImpact * 1.1;
          ball.vx = 5 * bounceAngle;
          ball.vy = -Math.abs(ball.vy) - 0.2;
        }

        for (const brick of player.bricks) {
          if (!brick.alive) continue;

          const hit =
            ball.x + ball.radius > brick.x &&
            ball.x - ball.radius < brick.x + brick.width &&
            ball.y + ball.radius > brick.y &&
            ball.y - ball.radius < brick.y + brick.height;

          if (hit) {
            brick.alive = false;
            player.score += 10;
            updateHud();
            ball.vy *= -1;

            if (player.bricks.every((item) => !item.alive)) {
              finishMatch(gameMode === 'two'
                ? `${player.name} cleared their board and wins! Press Start to play again.`
                : 'You win! Press Start to play again.');
            }
            break;
          }
        }

        if (ball.y - ball.radius > canvas.height) {
          loseLife(player);
        }
      }

      function drawPlayer(player) {
        ctx.save();
        ctx.translate(player.boardX, 0);
        for (const brick of player.bricks) {
          if (!brick.alive) continue;
          ctx.fillStyle = brick.color;
          ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
        }
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(player.paddle.x, player.paddle.y, player.paddle.width, player.paddle.height);
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(player.ball.x, player.ball.y, player.ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
        for (const player of players) {
          for (let i = player.boardX; i < player.boardX + player.boardWidth; i += 18) {
            ctx.fillRect(i, 0, 2, canvas.height);
          }
          drawPlayer(player);
        }

        if (gameMode === 'two') {
          ctx.strokeStyle = 'rgba(248, 250, 252, 0.6)';
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.moveTo(canvas.width / 2, 0);
          ctx.lineTo(canvas.width / 2, canvas.height);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      function gameLoop() {
        if (gameRunning) {
          for (const player of players) {
            if (!gameRunning) break;
            updatePlayer(player);
          }
        }
        draw();
        animationId = requestAnimationFrame(gameLoop);
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        const p1Keys = keys[0];
        const p2Keys = keys[1];

        if (key === 'a') {
          p1Keys.left = true;
        }
        if (key === 'd') {
          p1Keys.right = true;
        }
        if (event.key === 'ArrowLeft') {
          if (gameMode === 'two') {
            p2Keys.left = true;
          } else {
            p1Keys.left = true;
          }
          event.preventDefault();
        }
        if (event.key === 'ArrowRight') {
          if (gameMode === 'two') {
            p2Keys.right = true;
          } else {
            p1Keys.right = true;
          }
          event.preventDefault();
        }

        if (event.code === 'Space') {
          event.preventDefault();
          if (!gameRunning && !gameOver) {
            startGame();
          } else if (players.some((player) => player.ball.stuck) && !gameOver) {
            players.forEach((player) => {
              player.ball.stuck = false;
            });
            setMessage('Game on!');
          }
        }

        if (key === 'r') {
          resetGame();
        }
      });

      document.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a') {
          keys[0].left = false;
        }
        if (key === 'd') {
          keys[0].right = false;
        }
        if (event.key === 'ArrowLeft') {
          keys[gameMode === 'two' ? 1 : 0].left = false;
        }
        if (event.key === 'ArrowRight') {
          keys[gameMode === 'two' ? 1 : 0].right = false;
        }
      });

      modeSelect.addEventListener('change', resetGame);

      startBtn.addEventListener('click', () => {
        if (gameRunning) {
          resetGame();
        }
        startGame();
      });

      resetGame();
      if (animationId === null) {
        gameLoop();
      }
    </script>
  </body>
</html>
